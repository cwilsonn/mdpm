name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # pnpm comes from the `packageManager` field in package.json.
      - run: corepack enable

      # Scripts are skipped on purpose: `postinstall` runs `nuxt prepare` and native builds
      # (better-sqlite3), neither of which the CLI, core, or tests need.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm typecheck:cli
      - run: pnpm test
