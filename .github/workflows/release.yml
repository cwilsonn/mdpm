name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Opens/updates a release PR from conventional commits on main; merging it
      # bumps package.json, updates CHANGELOG.md, tags, and creates a GitHub Release.
      #
      # RELEASE_PLEASE_TOKEN (a PAT, see CLAUDE.md "Releases") makes the release PR trigger the normal
      # workflows, so the required `test` and `check` checks run on it. Without the secret it falls back
      # to GITHUB_TOKEN, whose PRs don't trigger workflows and need an admin merge.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
